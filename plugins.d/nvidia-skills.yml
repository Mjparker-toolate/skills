name: nvidia-skills

version: "1.5.0"
description: Find the right NVIDIA skill for GPU acceleration, CUDA, AI agents, data science, training, inference, robotics, Physical AI, simulation, networking, healthcare, and other NVIDIA workflows.

display_name: NVIDIA Skills
short_description: Find the right NVIDIA skill
long_description: Find and install the right NVIDIA skill across GPU acceleration, CUDA, data science, AI agents, model training and inference, Jetson and robotics, Physical AI and Omniverse, decision optimization, healthcare, speech, and DOCA networking. The plugin searches NVIDIA's live verified catalog, recommends up to three precise matches, and provides install commands and useful first prompts without preloading the catalog.

category: Developer Tools
logo: ./assets/nvidia.png
composer_icon: ./assets/nvidia.png
# screenshots: []   # optional; supply ./assets/*.png paths when we have any
website_url: https://build.nvidia.com/skills/
privacy_policy_url: https://www.nvidia.com/en-us/about-nvidia/privacy-center/
terms_of_service_url: https://developer.nvidia.com/legal/terms

keywords:
  - nvidia
  - gpu
  - cuda
  - ai-agents
  - data-loading
  - data-science
  - rapids
  - cudf
  - training
  - inference
  - llm-serving
  - nemo
  - dynamo
  - robotics
  - jetson
  - deepstream
  - simulation
  - omniverse
  - openusd
  - digital-twin
  - physical-ai
  - cad
  - cuopt
  - doca
  - medical-ai

default_prompts:
  - "Find the best NVIDIA skills for my GPU or accelerated-computing task."
  - "Which NVIDIA skills fit my Jetson, robotics, or Physical AI workflow?"
  - "Help me choose NVIDIA skills for medical imaging, speech, optimization, or DOCA networking."

# This plugin ships a single skill: nvidia-skill-finder.
#
# The new approach is discovery-first. Instead of bundling a curated subset
# of skills into the plugin (which loads every SKILL.md into the harness
# context on install and crowds the limited skill context space), the plugin
# ships only the finder. The finder routes users to any skill in the canonical
# ./skills/ catalog on demand, so the full catalog is reachable without paying
# the context cost of pre-loading it.
#
# It also decouples versioning: individual skills are version-managed in the
# catalog independently of this plugin's version, so a skill update no longer
# forces a plugin re-release (and vice versa).
include_skills:
  - skills/nvidia-skill-finder/


