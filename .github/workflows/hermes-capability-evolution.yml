name: Validate Hermes Capability Evolution

on:
  push:
    paths:
      - "skills/hermes-capability-evolution/**"
      - "catalog-exceptions.yml"
      - ".github/scripts/validate_hermes_skill.py"
      - ".github/workflows/hermes-capability-evolution.yml"
  pull_request:
    paths:
      - "skills/hermes-capability-evolution/**"
      - "catalog-exceptions.yml"
      - ".github/scripts/validate_hermes_skill.py"
      - ".github/workflows/hermes-capability-evolution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check skill structure, references, templates, and sync preservation
        run: python .github/scripts/validate_hermes_skill.py
      - name: Run offline helper and native-plugin regression tests
        run: python -m unittest discover -s skills/hermes-capability-evolution/scripts -p "test_*.py" -v
